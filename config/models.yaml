# config/models.yaml — cấu hình ba mô hình đích A1 · A2 · A3.
#
# Bộ model theo phụ lục GVHD đã ký (hạng mục 6). Đổi model = đổi `.env` + một khối targets,
# không sửa code.
# `model_id` là id đã chốt, khóa bằng `v-models-1.2`; giá trị biến `model_env` trong `.env` phải
# trùng `model_id`. Gateway chỉ có bí danh, nên trace ghi trường `model` của response để bắt trôi.
# `pricing_usd_per_mtok`: giá thật trên dashboard gateway (STT-15). Còn null thì src/obs/cost.py
# từ chối mở lô — không chạy lô nào khi còn TODO.
# Mỗi khối chỉ trỏ TÊN biến môi trường (base_url_env, api_key_env, model_env); giá trị thật
# nằm trong `.env`, mẫu ở `.env.example`. Pin model sau `v-models-1.2` (quy tắc cứng #9).

schema_version: "1.0"

# Tham số gọi model dùng chung; một target ghi đè được bằng khóa cùng tên trong khối của nó.
defaults:
  timeout_s: 60
  # Số lần THỬ LẠI, không tính lần gọi đầu: 5 ⇒ tối đa 6 lần gọi mạng. Chỉ áp cho 429/5xx/
  # timeout; model trả tool-call sai định dạng KHÔNG retry — đó là hành vi cần đo (parse_error).
  max_retries: 5
  backoff_base_s: 1.0
  backoff_max_s: 30.0
  temperature: 0
  # Ghi nguyên văn request/response vào logs/llm_client.jsonl — bằng chứng truy vì sao một
  # payload kích hoạt hay bị chặn. Đặt false nếu chỉ cần đếm token.
  log_bodies: true

targets:
  A1:
    label: "A1"
    # Đổi từ claude-opus-5 (doanh nghiệp Việt thực tế không dùng), GVHD duyệt 2026-11-06. Qua gateway
    # như A2/A3, temperature 0 theo defaults.
    base_url_env: GATEWAY_BASE_URL
    api_key_env: GATEWAY_API_KEY
    model_env: TARGET_MODEL_A1
    model_id: glm-5.3
    # Suy luận mức medium (TA quyết 2026-11-06): lời gọi dò cùng request USR trả 8 s thay vì 132 s.
    reasoning_effort: medium
    # Giá TẠM: dùng lại đơn giá glm-5.2 (A2), chưa tra dashboard gateway cho glm-5.3 — chi phí A1 trong
    # log/manifest có thể lệch giá thật. Thay giá thật thì `spend_from_log` tính lại cả lời gọi cũ.
    pricing_usd_per_mtok: {input: 2.10, output: 6.60}

  A2:
    label: "A2"
    base_url_env: GATEWAY_BASE_URL
    api_key_env: GATEWAY_API_KEY
    model_env: TARGET_MODEL_A2
    model_id: glm-5.2
    # Suy luận mức medium như A1 (TA quyết 2026-11-06).
    reasoning_effort: medium
    # Đơn giá TA cung cấp 2026-10-21 (STT-37).
    pricing_usd_per_mtok: {input: 2.10, output: 6.60}

  A3:
    label: "A3"
    base_url_env: GATEWAY_BASE_URL
    api_key_env: GATEWAY_API_KEY
    model_env: TARGET_MODEL_A3
    # Đổi từ glm-5.3-flash (timeout/429 liên tục trên gateway, 2026-11-03), GVHD duyệt 2026-11-03.
    model_id: deepseek-v4.1-flash-1017
    # Suy luận mức medium như A1/A2 (TA quyết 2026-11-06).
    reasoning_effort: medium
    # Giá TẠM: dùng lại đơn giá glm-5.3-flash, chưa tra dashboard gateway cho model mới — chi phí A3
    # trong log/manifest có thể lệch giá thật cho tới khi thay bằng giá dashboard.
    pricing_usd_per_mtok: {input: 0.60, output: 1.80}

# Model chấm `judge_pass` (USR ở STT-37, B3, B4) — giao thức thực nghiệm mục 8, N9. Ngoài A1–A3
# để không target nào tự chấm chính nó; khác họ với cả ba target. So USR giữa model chỉ là mô tả,
# RQ4 so preset trong cùng target. Pin như target: id ở đây, giá trị `JUDGE_MODEL` trong `.env` phải
# trùng; trace ghi `judge_model`. Không phải target: runner không bao giờ chạy tác vụ trên khối này.
judge:
  label: "Judge USR"
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model_env: JUDGE_MODEL
  model_id: claude-sonnet-5-5
  # SDK `anthropic` 1.13 không nhận `temperature` ở Messages.create (lần chạy thử STT-37 dừng vì
  # TypeError) — judge chạy sampling mặc định. Phán quyết judge vì thế không tất định;
  # độ lệch đo bằng soát tay 5 câu của STT-37.
  temperature: null
  # Đơn giá TA cung cấp 2026-10-21 (STT-37).
  pricing_usd_per_mtok: {input: 2.10, output: 6.60}

# Model sinh biến thể payload bằng paraphrase (mutator STT-43, model_mutate). GVHD duyệt opus-5
# làm attacker_model 2026-10-22 (checklist mục 8 việc 6). Pin như judge: id ở đây, giá trị
# `ATTACKER_MODEL` trong `.env` phải trùng; trace/log ghi `target_id = "attacker"`. Không phải
# target: runner không chạy tác vụ trên khối này. Dùng ở bước soạn payload (offline), không ở vòng tấn
# công thích ứng B5 (attacker_mode: adaptive) — đó là trục riêng của runner.
attacker:
  label: "Attacker paraphrase"
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model_env: ATTACKER_MODEL
  model_id: claude-opus-5
  # claude-opus-5 trả 400 khi có temperature: chạy sampling mặc định, nên nhiều lần gọi
  # cho biến thể khác nhau.
  temperature: null
  # Giá API trực tiếp của Anthropic cho claude-opus-5 (tra 2026-10-13).
  pricing_usd_per_mtok: {input: 5.00, output: 25.00}

# Model thử ngoài bộ đo — CHỈ cho lượt demo trên console (STT-82), runner lô không bao giờ đọc khối
# này. Người dùng chọn kênh gọi, gõ model_id và đơn giá trên trang Cấu hình; khối này giới hạn những
# gì được nhập. Không pin bằng `v-models-1.2` và không phải target: run ghi `target_id = "sandbox"`,
# lô tiền tố `demo-sandbox-` trong store riêng results/demo — không lẫn vào số liệu báo cáo. Log
# llm_client ghi `model` từng lần gọi nên vẫn truy được model nào đã chạy.
sandbox:
  label: "Model thử ngoài bộ đo"
  # Kênh gọi: tái dùng biến môi trường của judge/attacker (anthropic) và A1–A3 (gateway), không thêm khóa mới.
  # `temperature` theo kênh: anthropic null (Messages API của opus-5 trả 400), gateway 0.
  channels:
    gateway:
      label: "Gateway (tương thích OpenAI)"
      provider: openai
      base_url_env: GATEWAY_BASE_URL
      api_key_env: GATEWAY_API_KEY
      temperature: 0
    anthropic:
      label: "Anthropic API trực tiếp"
      provider: anthropic
      api_key_env: ANTHROPIC_API_KEY
      temperature: null
  model_id_pattern: "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,79}$"
  # Trần đơn giá nhập tay (USD/Mtok) — chặn gõ nhầm làm BudgetGuard tính sai chi phí lượt demo.
  max_price_usd_per_mtok: 100
