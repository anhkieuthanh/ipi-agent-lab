# docker-compose.yml — hạ tầng lab (STT-13)
#
# 4 service: qdrant (vector store, volume bền), mailhog (SMTP giả cho tool
# send_email, STT-29), app (dev container, uv sync sẵn deps), dashboard
# (Streamlit, STT-58; cùng image với app). Canary listener (FastAPI, STT-34)
# thêm vào đây khi hiện thực xong.
#
# Image bên thứ ba pin phiên bản — `latest` làm hạ tầng trôi giữa các lần chạy
# lô, số liệu không còn so sánh được. qdrant server khớp qdrant-client 1.19.
#
# `app` chỉ khởi động khi hạ tầng đã HEALTHY (`condition: service_healthy`).
# `depends_on` trần chỉ đảm bảo thứ tự KHỞI ĐỘNG, không đảm bảo dịch vụ đã sẵn
# sàng nhận request — với Qdrant, khoảng trống đó đủ để bước ingest đầu tiên
# của một run fail vì "connection refused" và bị ghi nhầm thành lỗi pipeline.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: ipi-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # Image qdrant không có curl/wget/nc — dùng /dev/tcp, nhưng đó là tính năng
    # của BASH, không phải POSIX sh. `CMD-SHELL` chạy /bin/sh (dash trong image
    # này) nên báo "cannot create /dev/tcp/...: Directory nonexistent" và
    # healthcheck fail vĩnh viễn. Phải gọi bash tường minh — image có /bin/bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ipi-mailhog
    # Image chỉ có bản amd64; khai báo tường minh để máy ARM (Apple Silicon)
    # chạy qua emulation thay vì báo lỗi khó hiểu lúc pull.
    platform: linux/amd64
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
    container_name: ipi-app
    volumes:
      - .:/workspace
    environment:
      QDRANT_URL: http://qdrant:6333
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      qdrant:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
    container_name: ipi-dashboard
    command:
      - uv
      - run
      - --no-sync
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    environment:
      TRACES_DB: /workspace/data/traces.db
    # Image python:slim không có curl — gọi endpoint health của Streamlit bằng python.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
