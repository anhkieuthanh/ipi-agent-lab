# docker-compose.yml — hạ tầng lab (STT-13)
#
# 5 service: qdrant (vector store, volume bền), mailhog (SMTP giả cho tool
# send_email, STT-29), canary-listener (bồn chứa của http_request, STT-34),
# app (dev container, uv sync sẵn deps).
# canary-listener, app dùng chung một image.
#
# Image bên thứ ba pin phiên bản — `latest` làm hạ tầng trôi giữa các lần chạy
# lô, số liệu không còn so sánh được. qdrant server khớp qdrant-client 1.19.
#
# `app` chỉ khởi động khi hạ tầng đã HEALTHY (`condition: service_healthy`).
# `depends_on` trần chỉ đảm bảo thứ tự KHỞI ĐỘNG, không đảm bảo dịch vụ đã sẵn
# sàng nhận request — với Qdrant, khoảng trống đó đủ để bước ingest đầu tiên
# của một run fail vì "connection refused" và bị ghi nhầm thành lỗi pipeline.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: ipi-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # Image qdrant không có curl/wget/nc — dùng /dev/tcp, nhưng đó là tính năng
    # của BASH, không phải POSIX sh. `CMD-SHELL` chạy /bin/sh (dash trong image
    # này) nên báo "cannot create /dev/tcp/...: Directory nonexistent" và
    # healthcheck fail vĩnh viễn. Phải gọi bash tường minh — image có /bin/bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ipi-mailhog
    # Image chỉ có bản amd64; khai báo tường minh để máy ARM (Apple Silicon)
    # chạy qua emulation thay vì báo lỗi khó hiểu lúc pull.
    platform: linux/amd64
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  # Bồn chứa `http` của G1: http_request chuyển mọi request tới host ngoài về
  # đây. Cổng chỉ mở trên loopback của máy host — harness chạy trên host gửi
  # tới 127.0.0.1:8099 (mặc định của tools.yaml), không lộ ra mạng ngoài.
  # Hit ghi vào data/canary_hits.db qua mount /workspace.
  canary-listener:
    build:
      context: .
    container_name: ipi-canary-listener
    command: ["uv", "run", "--no-sync", "python", "-m", "obs.canary_listener"]
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      CANARY_LISTENER_HOST: 0.0.0.0
      CANARY_LISTENER_PORT: "8099"
      CANARY_LISTENER_DB: /workspace/data/canary_hits.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
    container_name: ipi-app
    volumes:
      - .:/workspace
    environment:
      QDRANT_URL: http://qdrant:6333
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAILHOG_API_URL: http://mailhog:8025
      CANARY_LISTENER_URL: http://canary-listener:8099
    depends_on:
      qdrant:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      canary-listener:
        condition: service_healthy
    restart: unless-stopped

# Giao diện IPI Guard Console (API FastAPI + web React) chạy trên host bằng `make console`, không
# trong Compose: nó cần gọi model qua `.env` và bản build của web/, và chỉ nên nghe 127.0.0.1.

volumes:
  qdrant_data:
