[project]
name = "ipi-agent-lab"
version = "0.1.0"
description = "Hệ thống đánh giá và phòng chống tấn công tiêm nhiễm gián tiếp (Indirect Prompt Injection) cho agent RAG/MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "faker>=25.0",
    "fastembed>=0.8.0",
    "qdrant-client>=1.9",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "fpdf2>=2.8.7",
    "pypdf>=6.15.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src", "src/attack/payloads", "scripts"]
markers = [
  "qdrant: cần Qdrant đang chạy (`make up`); tự bỏ qua nếu không có",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Các module nội bộ được nạp qua `pythonpath` của pytest (src/, src/attack/payloads/,
# scripts/) chứ không qua package name — ruff không tự suy ra được, phải khai báo.
known-first-party = ["agent", "obs", "rag", "attack", "schema", "gen_corpus_pdfs", "seed_db"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
